# MXCentral privileged-helper sudoers include.
#
# Install as root after installing scripts/mxcentral-privileged at the fixed
# path below. Validate before installation:
#   visudo -cf /opt/www/mxcentral-for-iRedmail/docs/sudoers.conf
#   install -o root -g root -m 0440 /opt/www/mxcentral-for-iRedmail/docs/sudoers.conf /etc/sudoers.d/mxcentral-for-iRedmail
#
# Do not add arguments or wildcard commands here. The helper accepts no
# command-line arguments. It reads one JSON request from stdin and permits only
# named, validated operations against root-owned configured paths.

Defaults:www-data !requiretty

Cmnd_Alias MXC_PRIVILEGED_HELPER = /usr/local/sbin/mxcentral-privileged

www-data ALL=(root) NOPASSWD: MXC_PRIVILEGED_HELPER
